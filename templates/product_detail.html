<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
</head>

<body style="font-family:Arial; background:#f2f2f2; text-align:center; padding:50px;">
 <div style="background:#1a2a6c; padding:15px 30px; color:white; display:flex; justify-content:space-between; align-items:center;">

    <h2 style="margin:0;">🛒 MyShop</h2>
</div>

<div style="background:white; width:400px; margin:auto; padding:30px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.2);">

    <img src="{{ url_for('static', filename=product.image) }}" width="250">

    <h2>{{ product.name }}</h2>

    <h3 style="color:green;">₹{{ product.price }}</h3>

    <p>This is high quality product.</p>

    <a href="/add_to_cart/{{ product.id }}">
        <button style="padding:10px 20px; background:#28a745; color:white; border:none; border-radius:10px;">
            Add to Cart
        </button>
    </a>

    <br><br>

    <a href="/products">Back</a>

</div>

</body>
</html>
